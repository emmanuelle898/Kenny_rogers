name: outer-rim-workshop-tests

services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_DB: workshop_test
      POSTGRES_USER: workshop_tester
      POSTGRES_PASSWORD: workshop_test_password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop_tester -d workshop_test"]
      interval: 5s
      timeout: 5s
      retries: 12
