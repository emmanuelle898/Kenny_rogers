name: outer-rim-workshop

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: lightsaber
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - workshop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d workshop"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  workshop_data: